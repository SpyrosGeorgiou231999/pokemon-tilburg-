name: Build Pokemon Balkans
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the GBA toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
      - name: Get the Emerald decompilation
        run: git clone --depth 1 https://github.com/pret/pokeemerald.git decomp
      - name: Apply the Balkans changes
        run: cd decomp && git apply ../balkans.diff
      - name: Build
        run: cd decomp && make modern -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-balkans
          path: decomp/pokeemerald_modern.gba
